spring.application.name=HexaBack

# Configurações de conexão com o MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/HexaDevs2?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=hexaBanco123
spring.datasource.password=hexaBanco123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do Hibernate / JPA para MySQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Swagger
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.display-request-duration=true

# Configurações do JWT 🙏🙏🙏 vambora e marcha!!!
jwt.validity=${JWT_VALIDITY:3600}
jwt.secret=${JWT_SECRET:}
