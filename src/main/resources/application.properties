spring.application.name=HexaBack

# Configurações de conexão com o MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/haxaback?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password= SUA_SENHA
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do Hibernate / JPA para MySQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=create-drop


# Configurações do JWT 🙏🙏🙏 vambora e marcha!!!
jwt.validity=${JWT_VALIDITY:3600}
jwt.secret=${JWT_SECRET:}
